name: Build XEQM Core Binaries

on:
  push:
    tags:
      - "core-v*"
  workflow_dispatch:

permissions:
  contents: write

# On a tag push (a real release) we want the version banner to read e.g.
# "v1.0.2-release" rather than "v1.0.2-release-dev". The CMakeLists.txt picks
# up OXEN_RELEASE_SUFFIX from the environment when set, so we just point it
# at empty for tagged builds and leave it as the default ("-dev") otherwise.
env:
  OXEN_RELEASE_SUFFIX: ${{ github.ref_type != 'tag' && '-dev' || '' }}

jobs:
  linux-ubuntu-2404:
    name: Build Ubuntu 24.04 x64 binaries
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout core repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          # gperf is required by libunbound's configure step during the
          # BUILD_STATIC_DEPS source build. Without it the static deps build
          # fails with "configure: error: *** gperf not found" before any of
          # the project's own code is compiled.
          sudo apt update
          sudo apt install -y \
            git build-essential cmake pkg-config ccache curl zip unzip tar \
            gperf \
            libssl-dev libzmq3-dev libsodium-dev libunbound-dev \
            libreadline-dev libhidapi-dev libusb-1.0-0-dev libexpat1-dev \
            libpgm-dev libsqlite3-dev libcurl4-openssl-dev \
            libboost-all-dev libzstd-dev libgmp-dev

      - name: Patch SQLiteCpp headers for GCC
        shell: bash
        run: |
          grep -q '#include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Statement.h || \
            sed -i '/#include <memory>/a #include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Statement.h

          grep -q '#include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Column.h || \
            sed -i '/#include <SQLiteCpp\/Statement.h>/a #include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Column.h

          grep -n '#include <cstdint>' \
            external/SQLiteCpp/include/SQLiteCpp/Statement.h \
            external/SQLiteCpp/include/SQLiteCpp/Column.h

      - name: Configure (statically-linked dependencies)
        run: |
          # BUILD_STATIC_DEPS=ON makes cmake build Boost/OpenSSL/libsodium/libzmq/libcurl/etc.
          # from source and link them in statically. The resulting binaries depend only on
          # glibc and libstdc++, which makes them portable across most Linux distributions.
          # Without this, the produced binaries link to whatever versions the runner happens
          # to have installed and segfault on operators' machines due to ABI mismatch.
          rm -rf build
          mkdir -p build
          cd build
          # ARCH=x86-64 overrides the -march=native default so binaries run on any x86-64 CPU
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC_DEPS=ON \
            -DARCH=x86-64 \
            -DBoost_NO_BOOST_CMAKE=ON

      - name: Build
        run: |
          cd build
          make -j"$(nproc)"

      - name: Verify binaries
        run: |
          build/bin/xeqm-d --version
          build/bin/xeqm-wallet --version
          build/bin/xeqm-rpc --version
          file build/bin/xeqm-d
          file build/bin/xeqm-wallet
          file build/bin/xeqm-rpc

      - name: Confirm binaries link only against the portable runtime set
        run: |
          # Acceptable runtime dependencies for a portable Linux binary are limited to glibc,
          # libstdc++, libgcc_s, libm, libpthread, libdl, librt, linux-vdso, and the dynamic
          # linker. Anything else (libboost*, libssl*, libsodium*, libzmq*, libcurl*, libsqlite3*,
          # libgmp*, libzstd*, libreadline*, libhidapi*, libusb*, libunbound*) means
          # BUILD_STATIC_DEPS did not capture that dependency and the binary will not be
          # portable. We fail the build loudly so a regression doesn't quietly ship to operators.
          set -e
          ALLOW='^[[:space:]]*(linux-vdso\.so|libc\.so|libstdc\+\+\.so|libgcc_s\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so|/lib(64)?/ld-linux)'
          fail=0
          for bin in xeqm-d xeqm-wallet xeqm-rpc xeqm-mdb_copy xeqm-mdb_stat; do
            echo "=== $bin ==="
            ldd "build/bin/$bin"
            unexpected=$(ldd "build/bin/$bin" | awk '{print $1}' | grep -Ev "$ALLOW" || true)
            if [ -n "$unexpected" ]; then
              echo "FAIL: $bin has non-portable runtime dependencies:"
              echo "$unexpected"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "One or more binaries are not portably linked. Aborting release."
            exit 1
          fi
          echo "All binaries are portably linked."

      - name: Package Ubuntu binaries
        run: |
          VERSION="$(echo "${GITHUB_REF_NAME#core-v}" | tr '/' '-')"

          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          PKG="XEQM-core-${VERSION}-ubuntu-24.04-x86_64-${SHORT}"

          mkdir -p "$PKG"
          cp build/bin/xeqm-d "$PKG/"
          cp build/bin/xeqm-wallet "$PKG/"
          cp build/bin/xeqm-rpc "$PKG/"
          cp build/bin/xeqm-mdb_copy "$PKG/"
          cp build/bin/xeqm-mdb_stat "$PKG/"
          chmod +x "$PKG"/*

          {
            printf "XEQM Core Ubuntu 24.04 x86_64 binaries\\n\\n"
            printf "Source commit: %s\\n\\n" "$COMMIT"
            printf "Included:\\n"
            printf "  xeqm-d\\n"
            printf "  xeqm-wallet\\n"
            printf "  xeqm-rpc\\n"
            printf "  xeqm-mdb_copy\\n"
            printf "  xeqm-mdb_stat\\n\\n"
            printf "Version output:\\n\\n"
            ./build/bin/xeqm-d --version
            ./build/bin/xeqm-wallet --version
            ./build/bin/xeqm-rpc --version
          } > "$PKG/README.txt"

          tar -czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: XEQM-core-ubuntu-24.04-x86_64
          path: |
            XEQM-core-*-ubuntu-24.04-x86_64-*.tar.gz
            XEQM-core-*-ubuntu-24.04-x86_64-*.tar.gz.sha256

  linux-ubuntu-2404-arm64:
    name: Build Ubuntu 24.04 ARM64 binaries
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout core repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git build-essential cmake pkg-config ccache curl zip unzip tar \
            gperf \
            libssl-dev libzmq3-dev libsodium-dev libunbound-dev \
            libreadline-dev libhidapi-dev libusb-1.0-0-dev libexpat1-dev \
            libpgm-dev libsqlite3-dev libcurl4-openssl-dev \
            libboost-all-dev libzstd-dev libgmp-dev

      - name: Patch SQLiteCpp headers for GCC
        shell: bash
        run: |
          grep -q '#include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Statement.h || \
            sed -i '/#include <memory>/a #include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Statement.h

          grep -q '#include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Column.h || \
            sed -i '/#include <SQLiteCpp\/Statement.h>/a #include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Column.h

          grep -n '#include <cstdint>' \
            external/SQLiteCpp/include/SQLiteCpp/Statement.h \
            external/SQLiteCpp/include/SQLiteCpp/Column.h

      - name: Configure (statically-linked dependencies)
        run: |
          rm -rf build
          mkdir -p build
          cd build
          # ARCH=armv8-a targets the baseline ARMv8 ISA so binaries run on any AArch64 CPU
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC_DEPS=ON \
            -DARCH=armv8-a \
            -DBoost_NO_BOOST_CMAKE=ON

      - name: Build
        run: |
          cd build
          make -j"$(nproc)"

      - name: Verify binaries
        run: |
          build/bin/xeqm-d --version
          build/bin/xeqm-wallet --version
          build/bin/xeqm-rpc --version
          file build/bin/xeqm-d
          file build/bin/xeqm-wallet
          file build/bin/xeqm-rpc

      - name: Confirm binaries link only against the portable runtime set
        run: |
          set -e
          ALLOW='^[[:space:]]*(linux-vdso\.so|libc\.so|libstdc\+\+\.so|libgcc_s\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so|/lib/ld-linux-aarch64\.so)'
          fail=0
          for bin in xeqm-d xeqm-wallet xeqm-rpc xeqm-mdb_copy xeqm-mdb_stat; do
            echo "=== $bin ==="
            ldd "build/bin/$bin"
            unexpected=$(ldd "build/bin/$bin" | awk '{print $1}' | grep -Ev "$ALLOW" || true)
            if [ -n "$unexpected" ]; then
              echo "FAIL: $bin has non-portable runtime dependencies:"
              echo "$unexpected"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "One or more binaries are not portably linked. Aborting release."
            exit 1
          fi
          echo "All binaries are portably linked."

      - name: Package ARM64 binaries
        run: |
          VERSION="$(echo "${GITHUB_REF_NAME#core-v}" | tr '/' '-')"

          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          PKG="XEQM-core-${VERSION}-ubuntu-24.04-aarch64-${SHORT}"

          mkdir -p "$PKG"
          cp build/bin/xeqm-d "$PKG/"
          cp build/bin/xeqm-wallet "$PKG/"
          cp build/bin/xeqm-rpc "$PKG/"
          cp build/bin/xeqm-mdb_copy "$PKG/"
          cp build/bin/xeqm-mdb_stat "$PKG/"
          chmod +x "$PKG"/*

          {
            printf "XEQM Core Ubuntu 24.04 aarch64 binaries\\n\\n"
            printf "Source commit: %s\\n\\n" "$COMMIT"
            printf "Included:\\n"
            printf "  xeqm-d\\n"
            printf "  xeqm-wallet\\n"
            printf "  xeqm-rpc\\n"
            printf "  xeqm-mdb_copy\\n"
            printf "  xeqm-mdb_stat\\n\\n"
            printf "Version output:\\n\\n"
            ./build/bin/xeqm-d --version
            ./build/bin/xeqm-wallet --version
            ./build/bin/xeqm-rpc --version
          } > "$PKG/README.txt"

          tar -czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: XEQM-core-ubuntu-24.04-aarch64
          path: |
            XEQM-core-*-ubuntu-24.04-aarch64-*.tar.gz
            XEQM-core-*-ubuntu-24.04-aarch64-*.tar.gz.sha256

  windows-x64:
    name: Build Windows x64 binaries
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout core repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            autoconf
            automake
            libtool
            m4
            patch
            perl
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-unbound
            zip

      - name: Show build environment
        run: |
          uname -a
          pwd
          pwd -W
          which cmake
          cmake --version
          which make
          make --version | head -5
          gcc --version | head -3

      - name: Patch SQLiteCpp headers for GCC
        shell: bash
        run: |
          grep -q '#include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Statement.h || \
            sed -i '/#include <memory>/a #include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Statement.h

          grep -q '#include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Column.h || \
            sed -i '/#include <SQLiteCpp\/Statement.h>/a #include <cstdint>' external/SQLiteCpp/include/SQLiteCpp/Column.h

          grep -n '#include <cstdint>' \
            external/SQLiteCpp/include/SQLiteCpp/Statement.h \
            external/SQLiteCpp/include/SQLiteCpp/Column.h

      - name: Build Windows x64
        run: |
          make release-static-win64 -j"$(nproc)"

      - name: Locate Windows binaries
        id: locate
        shell: msys2 {0}
        run: |
          echo "Searching for Windows binaries..."
          find . -type f \( \
            -name 'xeqm-d.exe' -o \
            -name 'xeqm-wallet.exe' -o \
            -name 'xeqm-rpc.exe' -o \
            -name '*.dll' \
          \) | sort

          BIN_DIR="$(find . -type f -name 'xeqm-d.exe' -exec dirname {} \; | head -1)"

          if [ -z "$BIN_DIR" ]; then
            echo "FATAL: Could not find xeqm-d.exe"
            find . -type f -name '*.exe' | sort
            exit 1
          fi

          echo "bin_dir=$BIN_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Windows bin dir: $BIN_DIR"

      - name: Verify Windows binaries exist
        shell: msys2 {0}
        run: |
          BIN_DIR="${{ steps.locate.outputs.bin_dir }}"
          test -f "$BIN_DIR/xeqm-d.exe"
          test -f "$BIN_DIR/xeqm-wallet.exe"
          test -f "$BIN_DIR/xeqm-rpc.exe"

          file "$BIN_DIR/xeqm-d.exe"
          file "$BIN_DIR/xeqm-wallet.exe"
          file "$BIN_DIR/xeqm-rpc.exe"

      - name: Package Windows binaries
        shell: msys2 {0}
        run: |
          VERSION="$(echo "${GITHUB_REF_NAME#core-v}" | tr '/' '-')"

          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          BIN_DIR="${{ steps.locate.outputs.bin_dir }}"
          PKG="XEQM-core-${VERSION}-windows-x86_64-${SHORT}"

          mkdir -p "$PKG"

          cp "$BIN_DIR/xeqm-d.exe" "$PKG/"
          cp "$BIN_DIR/xeqm-wallet.exe" "$PKG/"
          cp "$BIN_DIR/xeqm-rpc.exe" "$PKG/"
          cp "$BIN_DIR/xeqm-mdb_copy.exe" "$PKG/"
          cp "$BIN_DIR/xeqm-mdb_stat.exe" "$PKG/"

          find "$BIN_DIR" -maxdepth 1 -type f -name '*.dll' -exec cp {} "$PKG/" \; || true

          {
            printf "XEQM Core Windows x86_64 binaries\n\n"
            printf "Source commit: %s\n\n" "$COMMIT"
            printf "Included:\n"
            printf "  xeqm-d.exe\n"
            printf "  xeqm-wallet.exe\n"
            printf "  xeqm-rpc.exe\n"
            printf "  xeqm-mdb_copy.exe\n"
            printf "  xeqm-mdb_stat.exe\n\n"
            printf "Version output:\n\n"
            wine "$BIN_DIR/xeqm-d.exe" --version || true
            wine "$BIN_DIR/xeqm-wallet.exe" --version || true
            wine "$BIN_DIR/xeqm-rpc.exe" --version || true
          } > "$PKG/README.txt"

          zip -r "${PKG}.zip" "$PKG"
          sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: XEQM-core-windows-x86_64
          path: |
            XEQM-core-*-windows-x86_64-*.zip
            XEQM-core-*-windows-x86_64-*.zip.sha256


  macos-arm64:
    name: Build macOS ARM64 binaries
    runs-on: macos-latest

    steps:
      - name: Checkout core repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake ninja pkg-config ccache \
            zeromq openssl@3 libsodium hidapi \
            sqlite3 curl gmp zstd doxygen

      - name: Build pinned Boost 1.85 for macOS
        shell: bash
        run: |
          set -euo pipefail

          BOOST_VERSION="1.85.0"
          BOOST_UNDERSCORE="1_85_0"
          BOOST_ROOT="$PWD/.ci/boost-${BOOST_VERSION}"

          mkdir -p .ci
          cd .ci

          if [ ! -d "boost_${BOOST_UNDERSCORE}" ]; then
            curl -L "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_UNDERSCORE}.tar.gz" -o boost.tar.gz
            tar -xzf boost.tar.gz
          fi

          cd "boost_${BOOST_UNDERSCORE}"

          ./bootstrap.sh --prefix="$BOOST_ROOT"

          ./b2 -d0             --prefix="$BOOST_ROOT"             --with-atomic             --with-chrono             --with-program_options             --with-serialization             --with-system             --with-thread             variant=release             link=static             threading=multi             cxxstd=17             architecture=arm             address-model=64             target-os=darwin             install

          echo "BOOST_ROOT=$BOOST_ROOT" >> "$GITHUB_ENV"
          echo "Boost installed at: $BOOST_ROOT"
          find "$BOOST_ROOT/lib" -maxdepth 1 -type f | sort

      - name: Patch bundled libzmq for CMake 4 compatibility
        shell: bash
        run: |
          set -euo pipefail

          FILE="external/oxen-mq/cmake/local-libzmq/LocalLibzmq.cmake"

          if ! grep -q 'CMAKE_POLICY_VERSION_MINIMUM' "$FILE"; then
            python3 -c 'from pathlib import Path; p=Path("external/oxen-mq/cmake/local-libzmq/LocalLibzmq.cmake"); s=p.read_text(); needle="    CMAKE_ARGS ${libzmq_compiler_args}\n"; repl="    CMAKE_ARGS ${libzmq_compiler_args}\n    -DCMAKE_POLICY_VERSION_MINIMUM=3.5\n"; assert needle in s, "Could not find libzmq CMAKE_ARGS line"; p.write_text(s.replace(needle, repl, 1))'
          fi

          grep -n 'CMAKE_ARGS\|CMAKE_POLICY_VERSION_MINIMUM' "$FILE"

      - name: Patch SQLiteCpp headers for AppleClang
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patches = [
              (
                  Path("external/SQLiteCpp/include/SQLiteCpp/Statement.h"),
                  "#include <memory>",
              ),
              (
                  Path("external/SQLiteCpp/include/SQLiteCpp/Column.h"),
                  "#include <SQLiteCpp/Statement.h>",
              ),
          ]

          for path, marker in patches:
              text = path.read_text()
              if "#include <cstdint>" not in text:
                  if marker not in text:
                      raise SystemExit(f"Marker not found in {path}: {marker}")
                  text = text.replace(marker, marker + "\n#include <cstdint>", 1)
                  path.write_text(text)

          for path, _ in patches:
              for i, line in enumerate(path.read_text().splitlines(), 1):
                  if "#include <cstdint>" in line:
                      print(f"{path}:{i}:{line}")
          PY

      - name: Configure macOS ARM64
        shell: bash
        run: |
          rm -rf build-macos-arm64
          mkdir -p build-macos-arm64
          cd build-macos-arm64

          BOOST_ROOT="$BOOST_ROOT"
          OPENSSL_ROOT="$(brew --prefix openssl@3)"
          ZEROMQ_ROOT="$(brew --prefix zeromq)"
          HIDAPI_ROOT="$(brew --prefix hidapi)"

          # ARCH=default avoids -march=native so binaries run on all Apple Silicon generations
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARCH=default \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_TESTS=OFF \
            -DBUILD_STATIC_DEPS=OFF \
            -DSTATIC=OFF \
            -DTREZOR=OFF \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DBoost_INCLUDE_DIR="$BOOST_ROOT/include" \
            -DBoost_LIBRARY_DIR_RELEASE="$BOOST_ROOT/lib" \
            -DBoost_USE_STATIC_LIBS=ON \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DCMAKE_PREFIX_PATH="$BOOST_ROOT;$ZEROMQ_ROOT;$OPENSSL_ROOT;$HIDAPI_ROOT" \
            -DWITH_SYSTEM_ZMQ=ON \
            -DBUILD_ZMQ=OFF \
            -DBUILD_LIBZMQ=OFF \
            -DZEROMQ_INCLUDE_DIR="$ZEROMQ_ROOT/include" \
            -DZEROMQ_LIBRARY="$ZEROMQ_ROOT/lib/libzmq.dylib" \
            -DHIDAPI_INCLUDE_DIR="$HIDAPI_ROOT/include" \
            -DHIDAPI_LIBRARY="$HIDAPI_ROOT/lib/libhidapi.dylib"

      - name: Build macOS ARM64
        shell: bash
        run: |
          cmake --build build-macos-arm64 \
            --target daemon simplewallet wallet_rpc_server mdb_copy mdb_stat \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Bundle Homebrew dylibs into binaries
        shell: bash
        run: |
          set -euo pipefail
          brew install dylibbundler

          mkdir -p build-macos-arm64/bin/libs
          for bin in xeqm-d xeqm-wallet xeqm-rpc; do
            echo "Bundling dylibs for $bin..."
            dylibbundler \
              -b \
              -x "build-macos-arm64/bin/$bin" \
              -d build-macos-arm64/bin/libs \
              -p "@executable_path/libs/" \
              -of -cd
          done

          echo "--- Bundled libs/ contents ---"
          ls -la build-macos-arm64/bin/libs/

          echo "--- Verify no Homebrew paths remain in binaries ---"
          for bin in xeqm-d xeqm-wallet xeqm-rpc; do
            if otool -L "build-macos-arm64/bin/$bin" | grep -E '/(opt/homebrew|usr/local/Cellar)' ; then
              echo "FATAL: $bin still references absolute Homebrew dylib paths"
              exit 1
            fi
          done
          echo "All binaries reference @executable_path-relative dylibs only."

      - name: Verify macOS binaries
        shell: bash
        run: |
          build-macos-arm64/bin/xeqm-d --version
          build-macos-arm64/bin/xeqm-wallet --version
          build-macos-arm64/bin/xeqm-rpc --version
          file build-macos-arm64/bin/xeqm-d
          file build-macos-arm64/bin/xeqm-wallet
          file build-macos-arm64/bin/xeqm-rpc

      - name: Package macOS ARM64 binaries
        shell: bash
        run: |
          VERSION="$(echo "${GITHUB_REF_NAME#core-v}" | tr '/' '-')"

          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          PKG="XEQM-core-${VERSION}-macos-arm64-${SHORT}"

          mkdir -p "$PKG"
          cp build-macos-arm64/bin/xeqm-d "$PKG/"
          cp build-macos-arm64/bin/xeqm-wallet "$PKG/"
          cp build-macos-arm64/bin/xeqm-rpc "$PKG/"
          cp build-macos-arm64/bin/xeqm-mdb_copy "$PKG/"
          cp build-macos-arm64/bin/xeqm-mdb_stat "$PKG/"
          cp -R build-macos-arm64/bin/libs "$PKG/"
          chmod +x "$PKG"/xeqm-d "$PKG"/xeqm-wallet "$PKG"/xeqm-rpc "$PKG"/xeqm-mdb_copy "$PKG"/xeqm-mdb_stat

          {
            printf "XEQM Core macOS ARM64 binaries\n\n"
            printf "Source commit: %s\n\n" "$COMMIT"
            printf "Included:\n"
            printf "  xeqm-d\n"
            printf "  xeqm-wallet\n"
            printf "  xeqm-rpc\n"
            printf "  xeqm-mdb_copy\n"
            printf "  xeqm-mdb_stat\n"
            printf "  libs/  (bundled runtime dylibs — keep next to the binaries)\n\n"
            printf "Version output:\n\n"
            ./build-macos-arm64/bin/xeqm-d --version
            ./build-macos-arm64/bin/xeqm-wallet --version
            ./build-macos-arm64/bin/xeqm-rpc --version
          } > "$PKG/README.txt"

          tar -czf "${PKG}.tar.gz" "$PKG"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: XEQM-core-macos-arm64
          path: |
            XEQM-core-*-macos-arm64-*.tar.gz
            XEQM-core-*-macos-arm64-*.tar.gz.sha256


  macos-x86_64:
    name: Build macOS Intel x86_64 binaries
    runs-on: [self-hosted, macOS, X64]
    if: github.event_name != 'pull_request'
    timeout-minutes: 120

    steps:
      - name: Checkout core repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake ninja pkg-config ccache \
            zeromq openssl@3 libsodium hidapi \
            sqlite3 curl gmp zstd doxygen

      - name: Build pinned Boost 1.85 for macOS
        shell: bash
        run: |
          set -euo pipefail

          BOOST_VERSION="1.85.0"
          BOOST_UNDERSCORE="1_85_0"
          BOOST_ROOT="$PWD/.ci/boost-${BOOST_VERSION}"

          mkdir -p .ci
          cd .ci

          if [ ! -d "boost_${BOOST_UNDERSCORE}" ]; then
            curl -L "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_UNDERSCORE}.tar.gz" -o boost.tar.gz
            tar -xzf boost.tar.gz
          fi

          cd "boost_${BOOST_UNDERSCORE}"

          ./bootstrap.sh --prefix="$BOOST_ROOT"

          ./b2 -d0             --prefix="$BOOST_ROOT"             --with-atomic             --with-chrono             --with-program_options             --with-serialization             --with-system             --with-thread             variant=release             link=static             threading=multi             cxxstd=17             architecture=x86             address-model=64             target-os=darwin             install

          echo "BOOST_ROOT=$BOOST_ROOT" >> "$GITHUB_ENV"
          echo "Boost installed at: $BOOST_ROOT"
          find "$BOOST_ROOT/lib" -maxdepth 1 -type f | sort

      - name: Patch bundled libzmq for CMake 4 compatibility
        shell: bash
        run: |
          set -euo pipefail

          FILE="external/oxen-mq/cmake/local-libzmq/LocalLibzmq.cmake"

          if ! grep -q 'CMAKE_POLICY_VERSION_MINIMUM' "$FILE"; then
            python3 -c 'from pathlib import Path; p=Path("external/oxen-mq/cmake/local-libzmq/LocalLibzmq.cmake"); s=p.read_text(); needle="    CMAKE_ARGS ${libzmq_compiler_args}\n"; repl="    CMAKE_ARGS ${libzmq_compiler_args}\n    -DCMAKE_POLICY_VERSION_MINIMUM=3.5\n"; assert needle in s, "Could not find libzmq CMAKE_ARGS line"; p.write_text(s.replace(needle, repl, 1))'
          fi

          grep -n 'CMAKE_ARGS\|CMAKE_POLICY_VERSION_MINIMUM' "$FILE"

      - name: Patch SQLiteCpp headers for AppleClang
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patches = [
              (
                  Path("external/SQLiteCpp/include/SQLiteCpp/Statement.h"),
                  "#include <memory>",
              ),
              (
                  Path("external/SQLiteCpp/include/SQLiteCpp/Column.h"),
                  "#include <SQLiteCpp/Statement.h>",
              ),
          ]

          for path, marker in patches:
              text = path.read_text()
              if "#include <cstdint>" not in text:
                  if marker not in text:
                      raise SystemExit(f"Marker not found in {path}: {marker}")
                  text = text.replace(marker, marker + "\n#include <cstdint>", 1)
                  path.write_text(text)

          for path, _ in patches:
              for i, line in enumerate(path.read_text().splitlines(), 1):
                  if "#include <cstdint>" in line:
                      print(f"{path}:{i}:{line}")
          PY

      - name: Configure macOS Intel x86_64
        shell: bash
        run: |
          rm -rf build-macos-x86_64
          mkdir -p build-macos-x86_64
          cd build-macos-x86_64

          BOOST_ROOT="$BOOST_ROOT"
          OPENSSL_ROOT="$(brew --prefix openssl@3)"
          ZEROMQ_ROOT="$(brew --prefix zeromq)"
          HIDAPI_ROOT="$(brew --prefix hidapi)"

          # ARCH=x86-64 avoids -march=native so binaries run on any Intel x86-64 CPU
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARCH=x86-64 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_TESTS=OFF \
            -DBUILD_STATIC_DEPS=OFF \
            -DSTATIC=OFF \
            -DTREZOR=OFF \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DBoost_INCLUDE_DIR="$BOOST_ROOT/include" \
            -DBoost_LIBRARY_DIR_RELEASE="$BOOST_ROOT/lib" \
            -DBoost_USE_STATIC_LIBS=ON \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DCMAKE_PREFIX_PATH="$BOOST_ROOT;$ZEROMQ_ROOT;$OPENSSL_ROOT;$HIDAPI_ROOT" \
            -DWITH_SYSTEM_ZMQ=ON \
            -DBUILD_ZMQ=OFF \
            -DBUILD_LIBZMQ=OFF \
            -DZEROMQ_INCLUDE_DIR="$ZEROMQ_ROOT/include" \
            -DZEROMQ_LIBRARY="$ZEROMQ_ROOT/lib/libzmq.dylib" \
            -DHIDAPI_INCLUDE_DIR="$HIDAPI_ROOT/include" \
            -DHIDAPI_LIBRARY="$HIDAPI_ROOT/lib/libhidapi.dylib"

      - name: Build macOS Intel x86_64
        shell: bash
        run: |
          cmake --build build-macos-x86_64 \
            --target daemon simplewallet wallet_rpc_server mdb_copy mdb_stat \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Bundle Homebrew dylibs into binaries
        shell: bash
        run: |
          set -euo pipefail
          brew install dylibbundler

          mkdir -p build-macos-x86_64/bin/libs
          for bin in xeqm-d xeqm-wallet xeqm-rpc; do
            echo "Bundling dylibs for $bin..."
            dylibbundler \
              -b \
              -x "build-macos-x86_64/bin/$bin" \
              -d build-macos-x86_64/bin/libs \
              -p "@executable_path/libs/" \
              -of -cd
          done

          echo "--- Bundled libs/ contents ---"
          ls -la build-macos-x86_64/bin/libs/

          echo "--- Verify no Homebrew paths remain in binaries ---"
          for bin in xeqm-d xeqm-wallet xeqm-rpc; do
            if otool -L "build-macos-x86_64/bin/$bin" | grep -E '/usr/local/(opt|Cellar)|/opt/homebrew' ; then
              echo "FATAL: $bin still references absolute Homebrew dylib paths"
              exit 1
            fi
          done
          echo "All binaries reference @executable_path-relative dylibs only."

      - name: Verify macOS binaries
        shell: bash
        run: |
          build-macos-x86_64/bin/xeqm-d --version
          build-macos-x86_64/bin/xeqm-wallet --version
          build-macos-x86_64/bin/xeqm-rpc --version
          file build-macos-x86_64/bin/xeqm-d
          file build-macos-x86_64/bin/xeqm-wallet
          file build-macos-x86_64/bin/xeqm-rpc

      - name: Package macOS Intel x86_64 binaries
        shell: bash
        run: |
          VERSION="$(echo "${GITHUB_REF_NAME#core-v}" | tr '/' '-')"

          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          PKG="XEQM-core-${VERSION}-macos-x86_64-${SHORT}"

          mkdir -p "$PKG"
          cp build-macos-x86_64/bin/xeqm-d "$PKG/"
          cp build-macos-x86_64/bin/xeqm-wallet "$PKG/"
          cp build-macos-x86_64/bin/xeqm-rpc "$PKG/"
          cp build-macos-x86_64/bin/xeqm-mdb_copy "$PKG/"
          cp build-macos-x86_64/bin/xeqm-mdb_stat "$PKG/"
          cp -R build-macos-x86_64/bin/libs "$PKG/"
          chmod +x "$PKG"/xeqm-d "$PKG"/xeqm-wallet "$PKG"/xeqm-rpc "$PKG"/xeqm-mdb_copy "$PKG"/xeqm-mdb_stat

          {
            printf "XEQM Core macOS Intel x86_64 binaries\n\n"
            printf "Source commit: %s\n\n" "$COMMIT"
            printf "Included:\n"
            printf "  xeqm-d\n"
            printf "  xeqm-wallet\n"
            printf "  xeqm-rpc\n"
            printf "  xeqm-mdb_copy\n"
            printf "  xeqm-mdb_stat\n"
            printf "  libs/  (bundled runtime dylibs — keep next to the binaries)\n\n"
            printf "Version output:\n\n"
            ./build-macos-x86_64/bin/xeqm-d --version
            ./build-macos-x86_64/bin/xeqm-wallet --version
            ./build-macos-x86_64/bin/xeqm-rpc --version
          } > "$PKG/README.txt"

          tar -czf "${PKG}.tar.gz" "$PKG"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Upload macOS Intel x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: XEQM-core-macos-x86_64
          path: |
            XEQM-core-*-macos-x86_64-*.tar.gz
            XEQM-core-*-macos-x86_64-*.tar.gz.sha256


  publish:
    name: Publish core release
    needs:
      - linux-ubuntu-2404
      - linux-ubuntu-2404-arm64
      - windows-x64
      - macos-arm64
      - macos-x86_64
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/core-v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: |
          find release-assets -type f -print

      - name: Compute release name
        id: relmeta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#core-v}"
          echo "title=XEQMLabs 'Ragnarok' v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.relmeta.outputs.title }}
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            XEQM Core binary release.

            Includes:
            - Ubuntu 24.04 x86_64 tar.gz
            - Ubuntu 24.04 aarch64 tar.gz
            - Windows x86_64 zip
            - macOS ARM64 tar.gz
            - macOS Intel x86_64 tar.gz

            Source commit:
            ${{ github.sha }}
